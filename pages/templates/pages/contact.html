{% extends "base.html" %}

{% block title %}Contact - BiblioLearn{% endblock %}

{% block content %}
    <h2>Contactez-nous</h2>

    {% if confirmation %}
        <p style="color: green; font-weight: bold;">{{ confirmation }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Envoyer</button>
    </form>
{% endblock %}
